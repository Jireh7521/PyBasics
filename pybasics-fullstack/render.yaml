# Render "Blueprint" -- lets you deploy this whole project (web service + a
# free Postgres database) with one click from Render's dashboard, via
# "New +" -> "Blueprint", pointing at your repo. You can also just create
# the two resources by hand in the dashboard and ignore this file -- see
# README.md for that walkthrough.
databases:
  - name: pybasics-db
    plan: free
    databaseName: pybasics
    user: pybasics

services:
  - type: web
    name: pybasics-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pybasics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS
        value: "*"
