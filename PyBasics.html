<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyBasics — Python Fundamentals Program (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --navy-950: #0f1a2e; --navy-900: #15233d; --navy-800: #1c2e4d; --navy-700: #28406b;
    --slate-300: #a9b7cf; --slate-100: #eef1f7;
    --gold: #c79a3d; --gold-soft: #e7c877;
    --good: #3f9d70; --good-bg: #163524;
    --bad: #c05a4e; --bad-bg: #3a1e1c;
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 15% 0%, #1a2c4c 0%, var(--navy-950) 55%);
    color: var(--slate-100);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; justify-content: center; min-height: 100%;
    padding: 44px 18px 64px;
  }
  .wrap { width: 100%; max-width: 640px; }
  .brand { font-family: 'Lora', Georgia, serif; font-weight: 600; font-size: 1.5rem; }
  .brand em { font-style: italic; color: var(--gold-soft); }
  .tagline { color: var(--slate-300); font-size: 0.9rem; margin-top: 4px; }

  /* ---- top bar used on levels / quiz / certificate ---- */
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; gap: 14px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .badge { font-size: 0.78rem; color: var(--slate-300); border: 1px solid var(--navy-700); padding: 5px 10px; border-radius: 3px; white-space: nowrap; }
  .linklike { background: none; border: none; color: var(--slate-300); font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0; }
  .linklike:hover { color: var(--gold-soft); }

  .card { background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%); border: 1px solid var(--navy-700); border-radius: 6px; padding: 34px 32px; }
  @media (max-width: 480px) { .card { padding: 26px 20px; } .brand { font-size: 1.3rem; } }

  /* ---- auth screen ---- */
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--navy-700); }
  .auth-tab { flex: 1; background: none; border: none; color: var(--slate-300); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 10px 0; cursor: pointer; border-bottom: 2px solid transparent; }
  .auth-tab.active { color: var(--gold-soft); border-bottom-color: var(--gold); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 0.82rem; color: var(--slate-300); }
  .field input { background: var(--navy-950); border: 1px solid var(--navy-700); border-radius: 4px; padding: 11px 12px; color: var(--slate-100); font-family: 'Inter', sans-serif; font-size: 0.95rem; }
  .field input:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 1px; }
  .auth-error { color: #f3d6d1; background: var(--bad-bg); border: 1px solid var(--bad); border-radius: 4px; padding: 9px 12px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
  .auth-error.show { display: block; }
  .auth-note { color: var(--slate-300); font-size: 0.78rem; margin-top: 16px; line-height: 1.5; }
  .primary-btn { width: 100%; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.92rem; background: var(--gold); color: #1a1305; border: none; padding: 12px 22px; border-radius: 4px; cursor: pointer; }
  .primary-btn:hover { background: var(--gold-soft); }

  /* ---- levels screen ---- */
  .level-grid { display: flex; flex-direction: column; gap: 12px; }
  .level-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--navy-800); border: 1px solid var(--navy-700); border-radius: 5px; padding: 16px 18px; text-align: left; cursor: pointer; font-family: 'Inter', sans-serif; }
  .level-card.locked { opacity: 0.5; cursor: not-allowed; }
  .level-card:not(.locked):hover { border-color: var(--gold); background: var(--navy-700); }
  .level-num { font-family: 'Lora', serif; font-weight: 600; font-size: 1.4rem; color: var(--gold-soft); width: 34px; flex-shrink: 0; }
  .level-info { flex: 1; }
  .level-title { font-weight: 600; font-size: 0.98rem; }
  .level-sub { color: var(--slate-300); font-size: 0.8rem; margin-top: 2px; }
  .level-status { font-size: 0.78rem; color: var(--slate-300); text-align: right; flex-shrink: 0; }
  .level-status.done { color: var(--good); }

  /* ---- quiz ---- */
  .progress-rail { height: 3px; background: var(--navy-800); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-soft) 100%); transition: width 0.3s ease; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--slate-300); margin-bottom: 26px; }
  .progress-label .score { color: var(--gold-soft); font-variant-numeric: tabular-nums; }
  .topic-tag { font-size: 0.78rem; color: var(--gold-soft); font-weight: 500; margin-bottom: 10px; }
  .question { font-family: 'Lora', Georgia, serif; font-size: 1.22rem; line-height: 1.5; font-weight: 500; margin: 0 0 18px; }
  pre.snippet { background: #0c1524; border: 1px solid var(--navy-700); border-left: 3px solid var(--gold); border-radius: 4px; padding: 14px 16px; overflow-x: auto; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 0.87rem; line-height: 1.55; color: #d8e1f2; margin: 0 0 22px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--navy-800); border: 1px solid var(--navy-700); color: var(--slate-100); border-radius: 5px; padding: 13px 16px; font-family: 'Inter', sans-serif; font-size: 0.95rem; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  .option .key { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; color: var(--slate-300); border: 1px solid var(--navy-700); border-radius: 3px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .option:hover:not(:disabled) { border-color: var(--gold); background: var(--navy-700); }
  .option:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--good); background: var(--good-bg); }
  .option.correct .key { border-color: var(--good); color: var(--good); }
  .option.incorrect { border-color: var(--bad); background: var(--bad-bg); }
  .option.incorrect .key { border-color: var(--bad); color: var(--bad); }
  .written-input { width: 100%; background: var(--navy-950); border: 1px solid var(--navy-700); border-radius: 5px; padding: 13px 16px; color: var(--slate-100); font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; margin-bottom: 22px; }
  .written-input:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 1px; }
  .written-input.correct { border-color: var(--good); background: var(--good-bg); color: #cdeedd; }
  .written-input.incorrect { border-color: var(--bad); background: var(--bad-bg); color: #f3d6d1; }
  .feedback { margin-top: 20px; padding: 14px 16px; border-radius: 5px; font-size: 0.89rem; line-height: 1.55; display: none; }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-bg); border: 1px solid var(--good); color: #cdeedd; }
  .feedback.bad { background: var(--bad-bg); border: 1px solid var(--bad); color: #f3d6d1; }
  .option.selected { border-color: var(--gold); background: var(--navy-700); }
  .option.selected .key { border-color: var(--gold); color: var(--gold-soft); }
  .card-foot { margin-top: 26px; display: flex; justify-content: flex-end; gap: 10px; }
  .submit-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; background: var(--gold); color: #1a1305; border: none; padding: 11px 22px; border-radius: 4px; cursor: pointer; transition: opacity 0.2s ease; }
  .submit-btn:hover:not(:disabled) { background: var(--gold-soft); }
  .submit-btn:disabled { background: var(--navy-700); color: var(--slate-300); cursor: not-allowed; }
  .submit-btn.hide { display: none; }
  .next-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; background: var(--gold); color: #1a1305; border: none; padding: 11px 22px; border-radius: 4px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .next-btn.show { opacity: 1; pointer-events: auto; }
  .next-btn:hover { background: var(--gold-soft); }

  /* ---- coding challenges ---- */
  .instructions { font-size: 0.95rem; line-height: 1.6; margin-bottom: 18px; }
  .instructions h4 { font-family: 'Lora', Georgia, serif; font-size: 1.1rem; color: var(--gold-soft); margin: 0 0 8px; }
  .instructions p { margin: 0 0 12px; }
  .instructions code, .feedback code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: #0c1524; border: 1px solid var(--navy-700); border-radius: 3px; padding: 1px 5px; }
  .code-editor { width: 100%; background: #0c1524; border: 1px solid var(--navy-700); border-left: 3px solid var(--gold); border-radius: 4px; padding: 14px 16px; color: #d8e1f2; font-family: 'JetBrains Mono', monospace; font-size: 0.87rem; line-height: 1.55; resize: vertical; tab-size: 4; white-space: pre; overflow-x: auto; }
  .code-editor:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 1px; }

  /* ---- level result ---- */
  .results { text-align: center; }
  .score-big { font-family: 'Lora', serif; font-size: 3rem; font-weight: 600; color: var(--gold-soft); line-height: 1; margin: 6px 0 2px; }
  .score-of { color: var(--slate-300); font-size: 0.92rem; margin-bottom: 6px; }
  .verdict { font-size: 1rem; margin: 18px 0 26px; }
  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .ghost-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; background: transparent; color: var(--gold-soft); border: 1px solid var(--gold); padding: 11px 22px; border-radius: 4px; cursor: pointer; }
  .ghost-btn:hover { background: var(--navy-800); }

  /* ---- certificate ---- */
  .cert { border: 2px solid var(--gold); border-radius: 6px; padding: 40px 30px; text-align: center; position: relative; background: linear-gradient(180deg, #16243f 0%, #101c33 100%); }
  .cert::before, .cert::after { content: ''; position: absolute; width: 34px; height: 34px; border: 2px solid var(--gold-soft); opacity: 0.5; }
  .cert::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .cert::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }
  .cert-kicker { font-family: 'Lora', serif; font-style: italic; color: var(--slate-300); font-size: 0.95rem; }
  .cert-title { font-family: 'Lora', serif; font-weight: 600; font-size: 1.6rem; margin: 10px 0 22px; color: var(--gold-soft); }
  .cert-name { font-family: 'Lora', serif; font-style: italic; font-size: 2rem; margin: 6px 0 18px; border-bottom: 1px solid var(--navy-700); display: inline-block; padding-bottom: 10px; }
  .cert-body { color: var(--slate-100); font-size: 0.95rem; line-height: 1.7; max-width: 420px; margin: 0 auto; }
  .cert-meta { margin-top: 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; font-size: 0.78rem; color: var(--slate-300); border-top: 1px solid var(--navy-700); padding-top: 14px; }
  .cert-meta-col { flex: 1; min-width: 0; }
  .cert-meta-col:first-child { text-align: left; }
  .cert-meta-col:last-child { text-align: right; }
  .cert-meta-label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.66rem; color: var(--gold-soft); margin-bottom: 3px; }
  .cert-sign-col { text-align: center; }
  .cert-sign-img { max-height: 42px; max-width: 140px; object-fit: contain; filter: brightness(0) invert(1); margin-bottom: 5px; }
  .cert-sign-placeholder { height: 42px; display: flex; align-items: flex-end; justify-content: center; color: var(--navy-700); font-size: 0.8rem; margin-bottom: 5px; }
  .cert-sign-rule { width: 120px; height: 1px; background: var(--navy-700); margin: 0 auto 5px; }
  .cert-sign-controls { margin-top: 12px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .cert-actions { display: flex; gap: 12px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .cert-stamp { position: absolute; width: 116px; height: 116px; right: 18px; bottom: 86px; transform: rotate(-13deg); opacity: 0.92; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45)); }
  .cert-stamp text { font-family: 'Inter', sans-serif; }
  @media (max-width: 480px) { .cert-stamp { width: 88px; height: 88px; right: 8px; bottom: 74px; } }

  footer { text-align: center; color: var(--navy-700); font-size: 0.78rem; margin-top: 30px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media print {
    body { background: white; padding: 0; }
    footer, .cert-actions, .cert-sign-controls, .topbar { display: none !important; }
    .cert { border-color: #333; background: white; color: #111; }
    .cert-name, .cert-title, .cert-kicker, .cert-body { color: #111 !important; }
    .cert-sign-img { filter: none; }
  }
</style>

<body>
<div class="wrap">
  <div id="topbar"></div>
  <div id="app"></div>
  <footer id="pageFooter">Built for beginners working through their first Python programs.</footer>
</div>

<script>
/* ---------------- helpers ---------------- */
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }
function shuffleArr(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pyFloat(n) { if (Number.isInteger(n)) return n + '.0'; let s = n.toFixed(4).replace(/0+$/, ''); if (s.endsWith('.')) s += '0'; return s; }
function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffleOptions(options, correctIdx) {
  const arr = options.map((o, i) => ({ o, correct: i === correctIdx }));
  const s = shuffleArr(arr);
  return { options: s.map(x => x.o), correct: s.findIndex(x => x.correct) };
}
function normalizeAnswer(s) { return String(s).trim().toLowerCase().replace(/\s+/g, '').replace(/^["']+|["']+$/g, ''); }
function finalize(correctStr, wrongArr) {
  const seen = new Set([correctStr]); const uniq = [];
  for (const w of wrongArr) { const s = String(w); if (!seen.has(s)) { seen.add(s); uniq.push(s); } if (uniq.length >= 3) break; }
  const pool = ['N/A', 'None of these', '\u2014', 'Error'];
  let pi = 0; while (uniq.length < 3 && pi < pool.length) { if (!seen.has(pool[pi])) { seen.add(pool[pi]); uniq.push(pool[pi]); } pi++; }
  return shuffleOptions([correctStr, ...uniq], 0);
}

/* ---------------- question factories ---------------- */
function T_arithmetic() {
  const op = pick(['+', '-', '*', '//', '%', '/']);
  let a, b, correct, correctStr;
  if (op === '/') { b = pick([2, 3, 4, 5, 8]); a = randInt(b, b * 9); correct = a / b; correctStr = pyFloat(correct); }
  else if (op === '//') { b = randInt(2, 9); a = randInt(10, 80); correct = Math.floor(a / b); correctStr = String(correct); }
  else if (op === '%') { b = randInt(2, 9); a = randInt(10, 80); correct = a % b; correctStr = String(correct); }
  else if (op === '+') { a = randInt(1, 50); b = randInt(1, 50); correct = a + b; correctStr = String(correct); }
  else if (op === '-') { a = randInt(20, 80); b = randInt(1, 19); correct = a - b; correctStr = String(correct); }
  else { a = randInt(2, 12); b = randInt(2, 12); correct = a * b; correctStr = String(correct); }
  const code = `result = ${a} ${op} ${b}\nprint(result)`;
  const deltas = op === '/' ? [1, -1, 0.5, -0.5, 2] : [1, -1, 2, -2, 5, -5];
  const wrong = deltas.map(d => op === '/' ? pyFloat(correct + d) : String(Math.round(correct + d)));
  const { options, correct: ci } = finalize(correctStr, wrong);
  const opName = { '+': 'addition', '-': 'subtraction', '*': 'multiplication', '//': 'floor division', '%': 'the modulo operator', '/': 'true division' }[op];
  return { topic: 'Numbers & operators', q: 'What does this code print?', code, options, correct: ci,
    explain: `This uses ${opName}. <code>${a} ${op} ${b}</code> evaluates to <code>${correctStr}</code>.` };
}
function T_type() {
  const items = [{ lit: '42', type: 'int' }, { lit: '3.14', type: 'float' }, { lit: '"hello"', type: 'str' },
    { lit: 'True', type: 'bool' }, { lit: '[1, 2, 3]', type: 'list' }, { lit: '{"a": 1}', type: 'dict' },
    { lit: 'None', type: 'NoneType' }, { lit: '(1, 2)', type: 'tuple' }];
  const it = pick(items);
  const allTypes = ['int', 'float', 'str', 'bool', 'list', 'dict', 'NoneType', 'tuple'];
  const wrong = shuffleArr(allTypes.filter(t => t !== it.type)).slice(0, 3);
  const { options, correct } = finalize(it.type, wrong);
  return { topic: 'Data types', q: `What does type(${it.lit}) return?`, code: null, options, correct,
    explain: `<code>${it.lit}</code> is a Python <code>${it.type}</code>, so <code>type()</code> reports <code>&lt;class '${it.type}'&gt;</code>.` };
}
function T_string() {
  const w = pick(['Python', 'Coding', 'Variable', 'Function', 'Keyboard', 'Sunshine']);
  const kind = pick(['slice', 'upper', 'lower', 'len', 'index']);
  let code, correct, wrong;
  if (kind === 'slice') {
    const start = randInt(0, 2), end = randInt(start + 2, Math.min(w.length, start + 5));
    code = `text = "${w}"\nprint(text[${start}:${end}])`;
    correct = w.slice(start, end);
    wrong = [w.slice(start, end + 1), w.slice(Math.max(0, start - 1), end), w.slice(start + 1, end)];
  } else if (kind === 'upper') {
    code = `text = "${w}"\nprint(text.upper())`; correct = w.toUpperCase();
    wrong = [w, w.toLowerCase(), w.toUpperCase() + '!'];
  } else if (kind === 'lower') {
    code = `text = "${w}"\nprint(text.lower())`; correct = w.toLowerCase();
    wrong = [w, w.toUpperCase(), w.toLowerCase().slice(1)];
  } else if (kind === 'len') {
    code = `text = "${w}"\nprint(len(text))`; correct = String(w.length);
    wrong = [String(w.length - 1), String(w.length + 1), String(w.length + 2)];
  } else {
    const idx = randInt(0, w.length - 1);
    code = `text = "${w}"\nprint(text[${idx}])`; correct = w[idx];
    const others = new Set([correct]); wrong = [];
    while (wrong.length < 3) { const c = w[randInt(0, w.length - 1)]; if (!others.has(c)) { others.add(c); wrong.push(c); } }
  }
  const { options, correct: ci } = finalize(correct, wrong);
  return { topic: 'Strings', q: 'What does this print?', code, options, correct: ci,
    explain: `Tracing the code: <code>${escapeHtml(code.split('\n')[1])}</code> outputs <code>${escapeHtml(correct)}</code>.` };
}
function T_list() {
  const arr = pick([[3, 7, 1, 9, 5], [10, 20, 30, 40], [2, 4, 6, 8, 10], [15, 3, 42, 8]]);
  const kind = pick(['index', 'len', 'append', 'sum', 'slice']);
  let code, correct, wrong;
  if (kind === 'index') {
    const idx = randInt(0, arr.length - 1);
    code = `nums = [${arr.join(', ')}]\nprint(nums[${idx}])`; correct = String(arr[idx]);
    wrong = shuffleArr(arr.filter((v, i) => i !== idx)).slice(0, 3).map(String);
  } else if (kind === 'len') {
    code = `nums = [${arr.join(', ')}]\nprint(len(nums))`; correct = String(arr.length);
    wrong = [String(arr.length - 1), String(arr.length + 1), String(arr.length + 2)];
  } else if (kind === 'append') {
    code = `nums = [${arr.join(', ')}]\nnums.append(100)\nprint(len(nums))`; correct = String(arr.length + 1);
    wrong = [String(arr.length), String(arr.length + 2), String(arr.length - 1)];
  } else if (kind === 'sum') {
    code = `nums = [${arr.join(', ')}]\nprint(sum(nums))`;
    const s = arr.reduce((a, b) => a + b, 0); correct = String(s);
    wrong = [String(s + arr[0]), String(Math.max(0, s - arr[0])), String(s + 10)];
  } else {
    const start = randInt(0, 1), end = randInt(start + 1, arr.length);
    code = `nums = [${arr.join(', ')}]\nprint(nums[${start}:${end}])`;
    correct = `[${arr.slice(start, end).join(', ')}]`;
    wrong = [`[${arr.slice(start, Math.min(arr.length, end + 1)).join(', ')}]`, `[${arr.slice(0, end).join(', ')}]`, `[${arr.slice(start).join(', ')}]`];
  }
  const { options, correct: ci } = finalize(correct, wrong);
  return { topic: 'Lists', q: 'What does this print?', code, options, correct: ci,
    explain: `Tracing the code line by line gives <code>${escapeHtml(correct)}</code>.` };
}
function T_conditional() {

  const orE = () => { let a = andE(); while (isK('or')) { i++; const l = a, r = andE(); a = E => { const x = l(E); return pyTruthy(x) ? x : r(E); }; } return a; };
  const tern = () => {
    const a = orE();
    if (!isK('if')) return a;
    i++; const c = orE();
    if (!isK('else')) pyThrow('SyntaxError', "expected 'else'");
    i++; const b = tern();
    return E => pyTruthy(c(E)) ? a(E) : b(E);
  };
  return { expr: tern, pos: () => i };
}
function pyCompile(toks) {
  const P = pyParse(toks), f = P.expr();
  if (P.pos() < toks.length) pyThrow('SyntaxError', 'invalid syntax');
  return f;
}
function pyRun(src) {
  const E = new Map(), aug = { '+=': '+', '-=': '-', '*=': '*', '/=': '/' };
  src.split('\n').forEach((line, n) => {
    try {
      const toks = pyTokens(line);
      if (!toks.length) return;
      if (toks[0].t === 'i' && toks[1] && toks[1].t === 'o' && (toks[1].v === '=' || aug[toks[1].v])) {
        const val = pyCompile(toks.slice(2))(E);
        E.set(toks[0].v, toks[1].v === '=' ? val : pyBin(aug[toks[1].v], E.has(toks[0].v) ? E.get(toks[0].v) : pyThrow('NameError', `name '${toks[0].v}' is not defined`), val));
      } else if (/^(def|if|elif|else|for|while|return|import|class)$/.test(toks[0].v)) {
        pyThrow('SyntaxError', 'this challenge accepts simple lines only (assignments and expressions)');
      } else pyCompile(toks)(E);
    } catch (e) { if (e.py) e.message = `Line ${n + 1}: ${e.message}`; throw e; }
  });
  return E;
}

function generateLevelQuestions(level) {
  const qs = [];
  const seen = new Set();
  let attempts = 0;
  const maxAttempts = level.count * 60;
  while (qs.length < level.count && attempts < maxAttempts) {
    attempts++;
    const item = pick(level.pools)();
    const key = item.topic + '|' + (item.code || '') + '|' + item.q;
    if (seen.has(key)) continue;
    seen.add(key);
    qs.push(item);
  }
  while (qs.length < level.count) qs.push(pick(level.pools)());
  return qs;
}

function loadAccounts() { try { return JSON.parse(localStorage.getItem('pybasics_accounts') || '{}'); } catch (e) { return {}; } }
function saveAccounts(a) { try { localStorage.setItem('pybasics_accounts', JSON.stringify(a)); } catch (e) {} }
function loadProgress(u) { try { return JSON.parse(localStorage.getItem('pybasics_progress_' + u) || '{}'); } catch (e) { return {}; } }
function saveProgress(u, p) { try { localStorage.setItem('pybasics_progress_' + u, JSON.stringify(p)); } catch (e) {} }
function loadFullName(u) { try { return localStorage.getItem('pybasics_fullname_' + u) || ''; } catch (e) { return ''; } }
function saveFullName(u, n) { try { localStorage.setItem('pybasics_fullname_' + u, n); } catch (e) {} }
function cleanFullName(s) { return String(s || '').trim().replace(/\s+/g, ' '); }
function validateFullName(n) {
  if (n.split(' ').filter(Boolean).length < 2) return 'Please enter your full name (first and last name) \u2014 it will appear on your certificate.';
  if (n.length > 60) return 'That name is too long \u2014 please keep it under 60 characters.';
  return '';
}
function loadSignature() { try { const v = localStorage.getItem('pybasics_director_signature'); return v === null ? DEFAULT_SIGNATURE : v; } catch (e) { return DEFAULT_SIGNATURE; } }
function saveSignature(dataUrl) { try { localStorage.setItem('pybasics_director_signature', dataUrl); } catch (e) {} }
function clearSignature() { try { localStorage.setItem('pybasics_director_signature', ''); } catch (e) {} }

/* ---------------- state ---------------- */
let state = { screen: 'auth', authMode: 'login', authError: '', user: null, progress: {},
  level: null, questions: [], qIndex: 0, score: 0, results: [], answered: false, selectedIndex: null };

try {
  const last = localStorage.getItem('pybasics_current_user');
  if (last) { state.user = last; state.progress = loadProgress(last); state.screen = 'levels'; }
} catch (e) {}

const app = document.getElementById('app');
const topbar = document.getElementById('topbar');
const pageFooter = document.getElementById('pageFooter');

function render() {
  if (state.user && state.screen !== 'auth' && state.screen !== 'name' && !loadFullName(state.user)) state.screen = 'name';
  if (state.screen === 'auth') renderAuth();
  else if (state.screen === 'name') renderName();
  else if (state.screen === 'levels') renderLevels();
  else if (state.screen === 'quiz') renderQuiz();
  else if (state.screen === 'levelResult') renderLevelResult();
  else if (state.screen === 'certificate') renderCertificate();
}

function renderAuth() {
  topbar.innerHTML = `<div><div class="brand">Py<em>Basics</em></div><div class="tagline">Python Fundamentals Program</div></div>`;
  pageFooter.style.display = 'block';
  app.innerHTML = `
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab ${state.authMode === 'login' ? 'active' : ''}" id="tabLogin">Log in</button>
        <button class="auth-tab ${state.authMode === 'signup' ? 'active' : ''}" id="tabSignup">Sign up</button>
      </div>
      <div class="auth-error ${state.authError ? 'show' : ''}">${state.authError}</div>
      ${state.authMode === 'signup' ? `<div class="field"><label for="fullname">Full name <span style="color:var(--slate-300);">(as it should appear on your certificate)</span></label><input id="fullname" autocomplete="name" maxlength="60"></div>` : ''}
      <div class="field"><label for="username">Username</label><input id="username" autocomplete="username"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="${state.authMode === 'login' ? 'current-password' : 'new-password'}"></div>
      <button class="primary-btn" id="authSubmit">${state.authMode === 'login' ? 'Log in' : 'Create account'}</button>
      <p class="auth-note">Your username and password are saved only in this browser, so they can appear on your certificate and your progress can be picked up later on this device. This isn't secure storage \u2014 don't reuse a password you use elsewhere.</p>
    </div>`;
  document.getElementById('tabLogin').onclick = () => { state.authMode = 'login'; state.authError = ''; render(); };
  document.getElementById('tabSignup').onclick = () => { state.authMode = 'signup'; state.authError = ''; render(); };
  document.getElementById('authSubmit').onclick = () => {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) { state.authError = 'Enter a username and password.'; render(); return; }
    const accounts = loadAccounts();
    let fullName = '';
    if (state.authMode === 'signup') {
      fullName = cleanFullName(document.getElementById('fullname').value);
      const nameErr = validateFullName(fullName);
      if (nameErr) { state.authError = nameErr; render(); return; }
      if (accounts[u]) { state.authError = 'That username is already taken.'; render(); return; }
      accounts[u] = p; saveAccounts(accounts); saveFullName(u, fullName);
    } else {
      if (!accounts[u]) { state.authError = 'No account found for that username. Please sign up first.'; state.authMode = 'signup'; render(); return; }
      if (accounts[u] !== p) { state.authError = 'Incorrect password.'; render(); return; }
    }
    state.user = u; state.progress = loadProgress(u); state.authError = '';
    try { localStorage.setItem('pybasics_current_user', u); } catch (e) {}
    state.screen = 'levels'; render();
  };
}

function renderName() {
  pageFooter.style.display = 'block';
  topbar.innerHTML = `<div><div class="brand">Py<em>Basics</em></div><div class="tagline">One more step</div></div>`;
  app.innerHTML = `
    <div class="card">
      <p class="topic-tag" style="margin-bottom:6px;">Your full name</p>
      <p style="color:var(--slate-300); font-size:0.88rem; margin:0 0 20px;">Enter your full name exactly as it should appear on your certificate.</p>
      <div class="auth-error ${state.nameError ? 'show' : ''}">${state.nameError || ''}</div>
      <div class="field"><label for="fullname">Full name</label><input id="fullname" autocomplete="name" maxlength="60"></div>
      <button class="primary-btn" id="nameSubmit">Continue</button>
    </div>`;
  const submit = () => {
    const n = cleanFullName(document.getElementById('fullname').value);
    const err = validateFullName(n);
    if (err) { state.nameError = err; render(); return; }
    saveFullName(state.user, n); state.nameError = ''; state.screen = 'levels'; render();
  };
  document.getElementById('nameSubmit').onclick = submit;
  document.getElementById('fullname').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

function renderLevels() {

function renderCodeQuiz(lvl, item) {
  state.codeMissed = false;
  app.innerHTML = `

      <div class="card-foot">
        <button class="submit-btn" id="submitBtn">Run &amp; check</button>

      </div>

  const ta = document.getElementById('codeInput');
  ta.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); ta.setRangeText('    ', ta.selectionStart, ta.selectionEnd, 'end'); } });
  document.getElementById('submitBtn').onclick = () => handleCodeAnswer(ta.value);

function handleCodeAnswer(code) {
  if (state.answered) return;
  const item = state.questions[state.qIndex];
  let env = null, err = '';
  try { env = pyRun(code); } catch (e) { err = e.py ? e.message : 'Something in your code could not be run.'; }
  const rows = Object.entries(item.expected).map(([k, want]) => {
    const has = !!env && env.has(k);
    return { k, ok: has && pyEq(env.get(k), want), got: has ? pyRepr(env.get(k)) : '(not set)', want: pyRepr(want) };
  });
  const isCorrect = !err && rows.every(r => r.ok);
  const feedback = document.getElementById('feedback');
  if (!isCorrect) {
    state.codeMissed = true;
    const lines = err ? '' : rows.map(r => `<div><code>${r.k}</code> ${r.ok ? '\u2713 correct' : '\u2717 is ' + escapeHtml(r.got) + ' \u2014 not right yet'}</div>`).join('');
    feedback.className = 'feedback show bad';
    feedback.innerHTML = `<strong>Not correct yet.</strong> ${err ? escapeHtml(err) : 'Fix your code and press Run &amp; check again \u2014 you can\u2019t move on until every variable is right.'}<div style="margin:8px 0 0;">${lines}</div>`;
    return;
  }
  state.answered = true;
  const first = !state.codeMissed;
  if (first) state.score += 1;
  state.results.push({ correct: first, topic: item.topic });
  document.getElementById('codeInput').disabled = true;
  const lines = rows.map(r => `<div><code>${r.k}</code> \u2713 <code>${escapeHtml(r.want)}</code></div>`).join('');
  feedback.className = 'feedback show good';
  feedback.innerHTML = `<strong>Correct${first ? '' : ' (after retrying \u2014 no point for this one)'}.</strong><div style="margin:8px 0;">${lines}</div>${item.explain}`;
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('submitBtn').classList.add('hide');
  document.querySelector('.progress-fill').style.width = ((state.qIndex + 1) / state.questions.length * 100) + '%';
  document.querySelector('.score').textContent = 'Score: ' + state.score;
}

function selectOption(index) {
  if (state.answered) return;
  state.selectedIndex = index;
  document.querySelectorAll('.option').forEach((btn, i) => btn.classList.toggle('selected', i === index));
  document.getElementById('submitBtn').disabled = false;
}

function handleWrittenAnswer(text) {
  if (state.answered) return;
  state.answered = true;
  const item = state.questions[state.qIndex];
  const expected = item.options[item.correct];
  const isCorrect = normalizeAnswer(text) === normalizeAnswer(expected);
  if (isCorrect) state.score += 1;
  state.results.push({ correct: isCorrect, topic: item.topic });
  const inputEl = document.getElementById('writtenInput');
  inputEl.disabled = true;
  inputEl.classList.add(isCorrect ? 'correct' : 'incorrect');
  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
  if (isCorrect) {
    feedback.innerHTML = `<strong>Correct.</strong> ${item.explain}`;
  } else {
    const chosenText = escapeHtml(text.trim() || '(nothing entered)');
    const correctText = escapeHtml(expected);
    feedback.innerHTML = `<strong>Not quite.</strong> You answered \u201c${chosenText}\u201d, but that's not what this code does \u2014 the correct answer is \u201c${correctText}\u201d. ${item.explain}`;
  }
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('submitBtn').classList.add('hide');
  document.querySelector('.progress-fill').style.width = ((state.qIndex + 1) / state.questions.length * 100) + '%';
  document.querySelector('.score').textContent = 'Score: ' + state.score;
}

function handleAnswer(index) {
  if (state.answered) return;
  state.answered = true;
  const item = state.questions[state.qIndex];
  const isCorrect = index === item.correct;
  if (isCorrect) state.score += 1;
  state.results.push({ correct: isCorrect, topic: item.topic });
  document.querySelectorAll('.option').forEach((btn, i) => {
    btn.disabled = true;
    if (i === item.correct) btn.classList.add('correct');
    else if (i === index) btn.classList.add('incorrect');
  });
  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
  if (isCorrect) {
    feedback.innerHTML = `<strong>Correct.</strong> ${item.explain}`;
  } else {
    const chosenText = escapeHtml(item.options[index]);
    const correctText = escapeHtml(item.options[item.correct]);
    feedback.innerHTML = `<strong>Not quite.</strong> You chose \u201c${chosenText}\u201d, but that's not what this code does \u2014 the correct answer is \u201c${correctText}\u201d. ${item.explain}`;
  }
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('submitBtn').classList.add('hide');
  document.querySelector('.progress-fill').style.width = ((state.qIndex + 1) / state.questions.length * 100) + '%';
  document.querySelector('.score').textContent = 'Score: ' + state.score;
  state.answered = true;
}

function finishLevel() {
  const lvl = state.level;
  const passed = state.score / lvl.count >= PASS_RATIO;
  const prevBest = state.progress[lvl.id] ? state.progress[lvl.id].best : 0;
  state.progress[lvl.id] = { best: Math.max(prevBest, state.score), passed: (state.progress[lvl.id] && state.progress[lvl.id].passed) || passed };
  saveProgress(state.user, state.progress);
  state.screen = 'levelResult'; state.lastPassed = passed; render();
}

function drawStamp(doc, cx, cy, r) {
  doc.setDrawColor('#c79a3d');
  doc.setLineWidth(1.1); doc.circle(cx, cy, r, 'S');
  doc.setLineWidth(0.7); doc.circle(cx, cy, r - 10, 'S');
  doc.setLineWidth(0.5); doc.circle(cx, cy, r - 18, 'S');
  const text = 'PYBASICS \u2022 CERTIFIED \u2022 PYTHON FUNDAMENTALS \u2022 ';
  const chars = text.split('');
  const n = chars.length;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(6.3); doc.setTextColor('#e7c877');
  chars.forEach((ch, i) => {
    const angle = -90 + (360 * i / n);
    const rad = angle * Math.PI / 180;
    const x = cx + (r - 5) * Math.cos(rad);
    const y = cy + (r - 5) * Math.sin(rad);
    doc.text(ch, x, y, { angle: -(angle - 90), align: 'center' });
  });
  doc.setDrawColor('#e7c877'); doc.setLineWidth(2);
  doc.line(cx - r * 0.22, cy + r * 0.02, cx - r * 0.05, cy + r * 0.2);
  doc.line(cx - r * 0.05, cy + r * 0.2, cx + r * 0.28, cy - r * 0.22);
}

function rasterizeToPng(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      try { resolve({ dataUrl: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height }); }
      catch (e) { reject(e); }
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function savePdf(name, dateStr, totalScore, totalQ) {
  const btn = document.getElementById('printBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparing\u2026';
  try {
    const downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    const { jsPDF } = window.jspdf || {};
    if (!jsPDF) throw new Error('pdf-lib-missing');
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    doc.setFillColor('#0f1a2e'); doc.rect(0, 0, W, H, 'F');
    doc.setDrawColor('#c79a3d'); doc.setLineWidth(1.5); doc.rect(28, 28, W - 56, H - 56);
    doc.setTextColor('#a9b7cf'); doc.setFont('helvetica', 'normal'); doc.setFontSize(12);
    doc.text('This certifies that', W / 2, 130, { align: 'center' });
    doc.setTextColor('#eef1f7'); doc.setFont('times', 'bolditalic'); doc.setFontSize(38);
    doc.text(name, W / 2, 180, { align: 'center' });
    doc.setTextColor('#e7c877'); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text('has completed the PyBasics Fundamentals Program', W / 2, 215, { align: 'center' });
    doc.setTextColor('#a9b7cf'); doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    const body = 'Covering the fundamentals of Python \u2014 variables, data types, strings, lists, control flow, functions, dictionaries, error handling and list comprehensions \u2014 across five progressively longer levels.';
    const lines = doc.splitTextToSize(body, W - 200);
    doc.text(lines, W / 2, 250, { align: 'center' });
    doc.setFontSize(11); doc.setTextColor('#c79a3d');
    doc.text(`Issued ${dateStr}      \u00b7      Best scores: ${totalScore}/${totalQ}`, W / 2, H - 60, { align: 'center' });
    const sigDataUrl = loadSignature();
    const signX = W / 2, lineY = H - 78, lineHalf = 65;
    if (sigDataUrl) {
      try {
        const raster = await rasterizeToPng(sigDataUrl);
        const maxW = 130, maxH = 34;
        const scale = Math.min(maxW / raster.w, maxH / raster.h, 1);
        const drawW = raster.w * scale, drawH = raster.h * scale;
        doc.addImage(raster.dataUrl, 'PNG', signX - drawW / 2, lineY - drawH - 4, drawW, drawH);
      } catch (e) { /* signature failed to rasterize; leave the line blank */ }
    }
    doc.setDrawColor('#28406b'); doc.setLineWidth(0.75);
    doc.line(signX - lineHalf, lineY, signX + lineHalf, lineY);
    doc.setFontSize(8.5); doc.setTextColor('#c79a3d'); doc.setFont('helvetica', 'normal');
    doc.text('Program Director', signX, lineY + 12, { align: 'center' });
    drawStamp(doc, W - 130, H - 150, 58);
    const blob = doc.output('blob');
    const filename = `PyBasics-Certificate-${name}.pdf`.replace(/\s+/g, '_');
    if (downloads) {
      await downloads.save({ filename, data: blob });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (e) {
    alert('Could not generate the PDF in this view. Try again, or use your browser\u2019s own Print option.');
  } finally {
    btn.disabled = false; btn.textContent = originalLabel;
  }
}

render();
</script>
