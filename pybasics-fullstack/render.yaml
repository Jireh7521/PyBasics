# Render Blueprint: PostgreSQL database plus FastAPI web service.
# Render will ask for the exact frontend origin; do not use a wildcard.
databases:
  - name: pybasics-db
    plan: free
    databaseName: pybasics
    user: pybasics

services:
  - type: web
    name: pybasics-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pybasics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS
        sync: false
